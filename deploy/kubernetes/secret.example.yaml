# TEMPLATE ONLY -- placeholder values. Copy to secret.yaml, fill in real
# values, and apply that copy -- never this file, and never a populated
# copy of this file, to Git.
#
# base64 in a Kubernetes Secret is ENCODING, NOT ENCRYPTION. Committing a
# populated Secret -- even base64-encoded -- defeats this project's entire
# credential-handling design just as surely as
# committing a plaintext .env would. Kubernetes stores Secret values in
# etcd; protect them with etcd encryption-at-rest (a cluster operator
# responsibility, not something this manifest can enforce) and consider
# a GitOps-friendly secret manager instead of applying this file by hand:
# External Secrets Operator, Sealed Secrets, SOPS, or your cloud
# provider's CSI secret driver. Any of these keeps the *encrypted*
# artifact in Git while the plaintext only ever exists inside the cluster.
#
# stringData (not data) is used below so placeholders stay human-readable;
# Kubernetes base64-encodes them into the underlying Secret object itself.
apiVersion: v1
kind: Secret
metadata:
  name: ftd-metrics-exporter-secrets
  namespace: monitoring
  labels:
    app.kubernetes.io/name: ftd-metrics-exporter
type: Opaque
stringData:
  # --- SCC backend ---
  SCC_API_TOKEN: "REPLACE_ME"

  # --- Standalone on-prem FMC backend ---
  FMC_USERNAME: "REPLACE_ME"
  FMC_PASSWORD: "REPLACE_ME"
