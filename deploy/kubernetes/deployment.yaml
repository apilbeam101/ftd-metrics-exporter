apiVersion: apps/v1
kind: Deployment
metadata:
  name: ftd-metrics-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: ftd-metrics-exporter
spec:
  # DELIBERATELY 1, not an oversight:
  #   - Each replica polls upstream independently. On BACKEND_TYPE=scc, whose
  #     hard limit is 2 requests/minute, TWO replicas at the default 60s
  #     POLL_INTERVAL_SECONDS already consume the entire budget with nothing
  #     left for retries; three would exceed it outright.
  #   - Two replicas also produce duplicate time series distinguished only by
  #     the `instance` label, breaking naive sum()/count() aggregations.
  #   - The exporter is stateless with an in-memory cache; a pod restart costs
  #     one poll interval of data, an acceptable, self-healing failure mode.
  # If you genuinely need HA: run 2 replicas but increase POLL_INTERVAL_SECONDS
  # proportionally so the aggregate rate stays within the upstream limit, and
  # deduplicate at the Prometheus/Thanos layer.
  replicas: 1
  # The default RollingUpdate strategy briefly runs 2 pods during every
  # rollout (maxSurge: 25% of 1 rounds up to 1 extra) -- verified directly:
  # `kubectl rollout restart` produced 2 concurrently Running pods for the
  # rollout's duration, doubling the upstream request rate for that window,
  # which the replicas:1 comment above says already consumes SCC's entire
  # budget. Recreate trades a few seconds of scrape gap (readinessProbe
  # already handles this) for never having 2 pods polling upstream at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ftd-metrics-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ftd-metrics-exporter
      annotations:
        # Alternative to a ServiceMonitor/PodMonitor for annotation-based
        # scrape discovery.
        prometheus.io/scrape: "true"
        prometheus.io/port: "10049"
        prometheus.io/path: "/metrics"
    spec:
      # The exporter never calls the Kubernetes API -- no need for the
      # default ServiceAccount token to be mounted into the pod.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ftd-metrics-exporter
          # Published to GHCR (public, no imagePullSecrets needed) on tagged
          # releases -- see the release workflow. Pin to at
          # least the minor tag in production, e.g. `:0.2`; `:latest` is
          # provided but not recommended. For the strongest guarantee, pin a
          # digest instead of any tag (`...@sha256:...`) -- digests are never
          # reused, whereas even the exact-version tag could in principle be
          # re-pointed by a compromised release pipeline.
          #
          # Building and running a local image instead (contributors,
          # air-gapped clusters): `docker build -t ftd-metrics-exporter .`
          # from the repo root, push it into your cluster's own registry or
          # `microk8s ctr image import` it, and replace this field.
          image: ghcr.io/apilbeam101/ftd-metrics-exporter:0.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ftd-metrics-exporter-config
            - secretRef:
                name: ftd-metrics-exporter-secrets
          ports:
            - name: metrics
              containerPort: 10049
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          livenessProbe:
            # Process is alive and the HTTP server is responding. Deliberately
            # does NOT depend on upstream API health -- a Cisco API outage
            # would otherwise trigger an endless restart loop that fixes
            # nothing and destroys the in-memory cache.
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            # 200 only once the first successful poll has populated the
            # cache, so the Service does not route scrapes to a pod that
            # would return an empty metrics page.
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            # Starting point, not a proven ceiling: sized for
            # a small Node process holding one JSON snapshot in memory. A
            # 1000-tunnel, 500-interface fleet will need more -- measure and
            # raise rather than trusting these defaults at scale.
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # volumeMounts:
          #   Only needed for BACKEND_TYPE=fmc with FMC_CA_BUNDLE_PATH set.
          #   Uncomment alongside the ConfigMap/Secret holding the CA bundle,
          #   and point FMC_CA_BUNDLE_PATH at the mount path below.
          #   - name: fmc-ca-bundle
          #     mountPath: /etc/ftd-exporter/ca
          #     readOnly: true
      # No writable volume is needed for readOnlyRootFilesystem: true --
      # verified directly (a real pod with no writable mount at all reaches
      # Ready and completes a poll cycle successfully). The exporter writes
      # nothing to disk and Node/undici need no temp path.
      # volumes:
      #   - name: fmc-ca-bundle
      #     configMap:
      #       name: ftd-metrics-exporter-fmc-ca
